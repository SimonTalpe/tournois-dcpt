name: Déploiement Supabase

# Après chaque fusion sur main : applique les migrations, déploie les Edge Functions
# et les réglages d'authentification (emails en français, code à 6 chiffres…).
#
# Identifiant du projet et adresse du site : non secrets, inscrits ci-dessous (env).
# Secrets GitHub nécessaires (Settings → Secrets and variables → Actions → Secrets) :
#   SUPABASE_ACCESS_TOKEN  : jeton personnel Supabase (Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   : mot de passe de la base choisi à la création du projet

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: fvhplztdwezndiziwhiu
      SITE_URL: https://mini-pong-flechettes.pages.dev
    steps:
      - uses: actions/checkout@v4

      - name: Vérification des secrets
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secret(s) GitHub manquant(s) :$missing (Settings → Secrets and variables → Actions → Secrets)"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          # Version figée : une nouvelle version majeure a déjà changé les options (18/11/2026).
          version: 3.2.0

      - name: Liaison au projet
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Migrations
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Edge Functions
        run: supabase functions deploy --use-api --yes

      - name: Réglages d'authentification et modèles d'emails
        run: |
          jq -n \
            --arg site_url "$SITE_URL" \
            --rawfile confirmation supabase/templates/confirmation.html \
            --rawfile recovery supabase/templates/recovery.html \
            '{
              site_url: $site_url,
              uri_allow_list: ($site_url + "/**,https://*.mini-pong-flechettes.pages.dev/**"),
              disable_signup: false,
              mailer_autoconfirm: false,
              mailer_otp_length: 6,
              mailer_otp_exp: 3600,
              password_min_length: 8,
              external_anonymous_users_enabled: true,
              mailer_subjects_confirmation: "Ton code d’activation – Mini-pong et fléchettes",
              mailer_templates_confirmation_content: $confirmation,
              mailer_subjects_recovery: "Ton code pour changer de mot de passe – Mini-pong et fléchettes",
              mailer_templates_recovery_content: $recovery
            }' > auth-config.json
          curl --fail-with-body -sS -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @auth-config.json > /dev/null
          echo "Réglages d'authentification appliqués."
